<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photobook — Sluggy Side Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-nav">
    <button
      class="nav-toggle"
      type="button"
      aria-label="Menu"
      aria-expanded="false"
      aria-controls="nav-menu"
    >
      <span></span><span></span><span></span>
    </button>
    <nav id="nav-menu" class="nav-menu">
      <a class="nav-link" href="index.html">Slug Story</a>
      <a class="nav-link" href="https://stickermule.com/sluggysideup" target="_blank" rel="noopener">Shop</a>
      <a class="nav-link is-active" href="photobook.html">Photobook</a>
      <a class="nav-link" href="send-a-letter.html">Send a Letter</a>
    </nav>
  </header>

  <section class="photobook-page">
    <div class="book-stage">
      <div class="book" id="book">
        <div class="book-rings" aria-hidden="true">
          <span class="ring"></span>
          <span class="ring"></span>
          <span class="ring"></span>
          <span class="ring"></span>
          <span class="ring"></span>
          <span class="ring"></span>
        </div>

        <div class="page page--cover" data-page="cover">
          <div class="cover-badge">
            <span>Sunny</span>
            <span>Doing</span>
            <span>Things</span>
          </div>
          <p class="photobook-hint">Tap to see more</p>
        </div>

        <div class="page" data-page="1">
          <div class="page-art">
            <img class="tilt-a" src="scrap-1.png" alt="Sunny walking under a pink umbrella in the rain, splashing through a puddle" />
          </div>
        </div>

        <div class="page" data-page="2">
          <div class="page-art">
            <img class="tilt-b" src="scrap-2.png" alt="Sunny in a red tie holding an MLK Day flag above three raised fists" />
          </div>
        </div>

        <div class="page" data-page="3">
          <div class="page-art">
            <img class="tilt-a" src="scrap-3.png" alt="Sunny curled up asleep atop a tall stack of colorful mattresses, princess-and-the-pea style" />
          </div>
        </div>

        <div class="page" data-page="4">
          <div class="page-art">
            <img class="tilt-b" src="scrap-4.png" alt="Sunny in a Texas Longhorns jersey resting on a Texas football" />
          </div>
        </div>

        <div class="page" data-page="5">
          <div class="page-art">
            <img class="tilt-a" src="scrap-5.png" alt="A devilish Sunny with horns beside a pitchfork and a Do Not Pet The Slug sign on a fence" />
          </div>
        </div>

        <div class="page" data-page="6">
          <div class="page-art">
            <img class="tilt-b" src="scrap-6.png" alt="Sunny relaxing in a bubble bath with a candle and towels nearby" />
          </div>
        </div>

        <div class="page" data-page="7">
          <div class="page-art">
            <img class="tilt-a" src="scrap-7.png" alt="Sunny popping a wheelie on a blue bicycle with a basket of groceries" />
          </div>
        </div>

        <div class="page" data-page="8">
          <div class="page-art">
            <img class="tilt-b" src="scrap-8.png" alt="Sunny blowing a big pink bubblegum bubble next to a gumball machine" />
          </div>
        </div>

        <div class="page" data-page="9">
          <div class="page-art">
            <img class="tilt-a" src="scrap-9.png" alt="Sunny sleeping on a heart-patterned mushroom next to a rainbow heart mushroom" />
          </div>
        </div>

        <div class="page" data-page="10">
          <div class="page-art">
            <img class="tilt-b" src="scrap-10.jpg" alt="Sunny surfing at sunset with a shark fin trailing behind" />
          </div>
        </div>

        <div class="page page--cover" data-page="outro">
          <div class="cover-badge">
            <span>Want To</span>
            <span>See More?</span>
            <a href="https://www.instagram.com/sluggysideup" target="_blank" rel="noopener">@sluggysideup</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
