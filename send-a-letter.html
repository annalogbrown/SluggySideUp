<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Letter — Sluggy Side Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-nav">
    <nav id="nav-menu" class="nav-menu">
      <a class="nav-link" href="index.html">Slug Story</a>
      <a class="nav-link" href="https://stickermule.com/sluggysideup" target="_blank" rel="noopener">Shop</a>
      <a class="nav-link" href="photobook.html">Photobook</a>
      <a class="nav-link is-active" href="send-a-letter.html">Send a Letter</a>
    </nav>
  </header>

  <section class="placeholder placeholder--letter">
    <div class="overlay-figure">
      <img
        class="placeholder-img"
        src="valentine-sunny.png"
        alt="Sunny the slug blushing with a heart tattoo, tongue out, beside a heart box of chocolates reading Happy V-Day and a mailbox with a love letter"
        width="900"
        height="470"
      />
      <span class="floating-heart floating-heart--1" aria-hidden="true">
        <svg viewBox="0 0 32 30"><path d="M16 29C16 29 2 19.5 2 10.5C2 5.8 5.8 2 10.5 2C13 2 15 3.2 16 5.1C17 3.2 19 2 21.5 2C26.2 2 30 5.8 30 10.5C30 19.5 16 29 16 29Z" style="fill: var(--heart-red); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round;" /></svg>
      </span>
      <span class="floating-heart floating-heart--2" aria-hidden="true">
        <svg viewBox="0 0 32 30"><path d="M16 29C16 29 2 19.5 2 10.5C2 5.8 5.8 2 10.5 2C13 2 15 3.2 16 5.1C17 3.2 19 2 21.5 2C26.2 2 30 5.8 30 10.5C30 19.5 16 29 16 29Z" style="fill: var(--heart-red); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round;" /></svg>
      </span>
      <span class="floating-heart floating-heart--3" aria-hidden="true">
        <svg viewBox="0 0 32 30"><path d="M16 29C16 29 2 19.5 2 10.5C2 5.8 5.8 2 10.5 2C13 2 15 3.2 16 5.1C17 3.2 19 2 21.5 2C26.2 2 30 5.8 30 10.5C30 19.5 16 29 16 29Z" style="fill: var(--heart-red); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round;" /></svg>
      </span>
    </div>

    <form class="contact-card" id="contact-form" action="mailto:sluggysideup@gmail.com" method="get">
      <h2 class="contact-title">Contact Us</h2>
      <label class="contact-field">
        <span>Your email</span>
        <input type="email" name="email" required placeholder="you@example.com" />
      </label>
      <label class="contact-field">
        <span>Your message</span>
        <textarea name="message" rows="5" required placeholder="Say hi to Sunny..."></textarea>
      </label>
      <button type="submit" class="send-btn">Send</button>
    </form>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
